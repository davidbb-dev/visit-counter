name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                node-version: '24.16.0'
            
            - name: Install dependencies
              run: npm ci
              
            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build Docker image
              run: docker build -t visit-counter .