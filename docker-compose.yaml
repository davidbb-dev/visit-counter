services:
  app:
    build: .
    image: visit-counter
    scale: 2
    environment:
      APP_PORT: ${APP_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  
  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:${HOST_PORT}:${NGINX_PORT}"
    environment:
      APP_PORT: ${APP_PORT}
      NGINX_PORT: ${NGINX_PORT}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro,Z
    depends_on:
      - app
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--port", "${REDIS_PORT}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data: